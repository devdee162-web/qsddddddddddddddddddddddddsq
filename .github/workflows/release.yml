name: Build & Release Zcord

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Discord (build dependency)
        shell: pwsh
        run: ./scripts/ci-install-discord.ps1

      - name: Build Zcord installer
        run: pnpm run buildInstaller:full

      - name: Upload GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs --upload
